- name: Record the parameters this role was invoked with
  ansible.builtin.copy:
    content: |
      {{
        {
          "test_str": test_str,
          "test_bool": test_bool | bool,
        } | to_nice_json
      }}
    dest: "/tmp/test_output.json"
    mode: "0644"

- name: Wait indefinitely
  ansible.builtin.command:
    cmd: sleep infinity
  when: test_hang | bool

- name: Fail on purpose
  ansible.builtin.fail:
    msg: The test role was asked to fail via test_fail.
  when: test_fail | bool
